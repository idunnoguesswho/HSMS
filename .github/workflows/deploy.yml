name: Deploy

# Builds server deps in a clean runner first (so a broken install never
# reaches the VPS), then SSHes in to pull, install, and restart.
# The VPS is assumed to already have the repo cloned, Node/npm installed,
# and its own webapp/server/.env configured - secrets never touch GitHub,
# only SSH access does.
#
# One-time setup required (see sidebar repo's README for the equivalent):
#   1. Generate a dedicated deploy keypair, add the public half to the
#      VPS's ~/.ssh/authorized_keys for the deploy user.
#   2. In this repo: Settings -> Environments -> New environment "production"
#      -> add secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (private key),
#      DEPLOY_PORT, DEPLOY_APP_DIR (path to the repo on the VPS), and
#      DEPLOY_RESTART_CMD (e.g. `pm2 restart hsms` or `systemctl restart hsms`).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install server dependencies
        working-directory: webapp/server
        run: npm ci

  deploy:
    needs: build-check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_APP_DIR }}"
            git fetch origin main
            git checkout main
            git pull origin main

            cd webapp/server
            npm ci --omit=dev

            cd ../..
            ${{ secrets.DEPLOY_RESTART_CMD }}
